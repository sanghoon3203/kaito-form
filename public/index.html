<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>図面・工事予定のご提出 | 株式会社カイトー商会</title>
  <style>
    :root{font-family:Manrope,"Noto Sans JP",sans-serif;color:#171717;background:#f5f5f3;font-size:16px}*{box-sizing:border-box}body{margin:0}a.skip{position:absolute;top:-100px;left:12px;background:#fff;padding:12px;z-index:10}a.skip:focus{top:12px}header{background:#fff;border-bottom:1px solid #e4e4e4}.header-inner{max-width:1080px;margin:auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}.logo{width:240px;max-width:62%;height:auto}.header-label{font-size:12px;color:#666;letter-spacing:.06em}main{max-width:1080px;margin:auto;padding:64px 24px 80px}.intro{max-width:680px;margin-bottom:40px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#0058a8;font-weight:700;margin:0 0 16px}.intro h1{font-size:36px;line-height:1.3;letter-spacing:.03em;margin:0 0 16px;text-wrap:balance}.intro p{color:#555;line-height:1.8;margin:0;text-wrap:pretty}.layout{display:grid;grid-template-columns:minmax(0,760px);gap:32px;align-items:start}.panel{background:white;border:1px solid #e5e5e5;padding:40px}.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:24px}.section-head h2{font-size:20px;margin:0}.section-head span{font-size:12px;color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.field{margin-bottom:24px}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}.required{font-size:12px;color:#0058a8;margin-left:8px}.hint{font-size:12px;color:#666;line-height:1.6;margin:8px 0 0}input,select,textarea{font:inherit;color:inherit;width:100%;border:1px solid #c9c9c9;border-radius:4px;padding:12px;background:#fff;min-height:48px}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #89bce7;outline-offset:2px}textarea{min-height:120px;resize:vertical;line-height:1.6}input[type=file]{padding:12px;font-size:14px}input[type=file]::file-selector-button{border:0;background:#eee;padding:8px 12px;border-radius:4px;margin-right:12px;color:#222}hr{border:0;border-top:1px solid #ececec;margin:32px 0}.notice{font-size:14px;line-height:1.8;color:#555}.notice h2{font-size:14px;color:#171717;margin:0 0 12px}.notice p{margin:0 0 24px}.notice strong{color:#0058a8}.button{font:inherit;font-weight:700;background:#0058a8;color:#fff;border:0;border-radius:4px;padding:12px 24px;min-height:48px;cursor:pointer;transition:background .3s cubic-bezier(.22,1,.36,1)}.button:hover{background:#00447f}.button:active{transform:translateY(1px)}.button:disabled{background:#aaa;cursor:not-allowed}.status{font-size:14px;line-height:1.7;margin:16px 0 0;white-space:pre-wrap}.status.error{color:#a32727}.status.success{color:#12673a}.foot{max-width:1080px;margin:auto;padding:24px;color:#777;font-size:12px;border-top:1px solid #ddd}.cf-turnstile{margin-bottom:16px}@media(max-width:720px){main{padding:40px 16px 64px}.header-inner{padding:12px 16px}.logo{width:200px}.header-label{font-size:12px}.intro h1{font-size:30px}.layout{grid-template-columns:1fr;gap:24px}.panel{padding:24px}.grid{grid-template-columns:1fr;gap:0}.notice{order:-1}.notice p{margin:0}.notice h2{margin-bottom:8px}}
    .brands{display:flex;align-items:center;gap:20px}.brands .logo{max-width:none;padding-left:20px;border-left:1px solid #ddd}.brand-baqool{height:28px;width:auto}@media(max-width:720px){.brands{gap:12px}.brands .logo{width:170px;padding-left:12px}.brand-baqool{height:20px}}
  </style>
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<header><div class="header-inner"><div class="brands"><img class="brand-baqool" src="baqool.png" alt="BAQOOL"><img class="logo" src="logo.png" alt="株式会社カイトー商会"></div></div></header>
<main id="main">
  <div class="intro"><p class="eyebrow">お申し込み受付</p><h1>お申し込みフォーム</h1></div>
  <div class="layout">
    <form class="panel" id="submission" novalidate>
      <div class="section-head"><h2>ご提出内容</h2><span>必須項目をご入力ください</span></div>
      <div class="grid"><div class="field"><label for="company">会社名<span class="required">必須</span></label><input id="company" name="company" autocomplete="organization" maxlength="100" required></div><div class="field"><label for="branch">支店名</label><input id="branch" name="branch" maxlength="100"></div></div>
      <div class="field"><label for="contact">ご担当者名<span class="required">必須</span></label><input id="contact" name="contact" autocomplete="name" maxlength="100" required></div>
      <div class="field"><label for="email">メールアドレス<span class="required">必須</span></label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
      <hr>
      <div class="section-head"><h2>案件情報</h2></div>
      <div class="field"><label for="projectName">案件名<span class="required">必須</span></label><input id="projectName" name="projectName" maxlength="200" required aria-describedby="projectName-hint"><p class="hint" id="projectName-hint">例：〇〇様邸 新築工事</p></div>
      <div class="field"><label for="projectAddress">案件住所<span class="required">必須</span></label><input id="projectAddress" name="projectAddress" maxlength="200" required></div>
      <div class="field"><label for="heating">床下暖房種別</label><select id="heating" name="heating"><option value="">未定</option><option value="放熱器">放熱器</option><option value="AC">AC</option><option value="ﾌｧﾝｺﾝﾍﾞｸﾀｰ">ファンコンベクター</option></select></div>
      <div class="field"><label for="start">着工予定日</label><input id="start" name="start" type="date" aria-describedby="start-hint"><p class="hint" id="start-hint">予定日が未定の場合は、空欄のままご送信いただけます。</p></div>
      <div class="field"><label for="note">備考</label><textarea id="note" name="note" maxlength="1000"></textarea></div>
      <hr>
      <div class="field"><label for="drawing">図面ファイル<span class="required">必須</span></label><input id="drawing" name="drawing" type="file" accept="application/pdf,.pdf,.jww" multiple required aria-describedby="drawing-hint"><p class="hint" id="drawing-hint">PDFとJWWをそれぞれ10ファイルまで、1ファイル50MBまで添付できます。</p></div>
      <div id="turnstile"></div><button class="button" id="submit" type="submit">内容を送信する</button><p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
      </div>
</main>
<footer class="foot">© 株式会社カイトー商会</footer>
<script>
const form = document.querySelector('#submission');
const status = document.querySelector('#status');
const submit = document.querySelector('#submit');
let pending;
form.addEventListener('change', () => { pending = undefined; });

async function loadTurnstile() {
  const response = await fetch('api.php?action=config');
  if (!response.ok) return;
  const { siteKey } = await response.json();
  if (!siteKey) return;
  const script = document.createElement('script');
  script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
  script.async = true;
  script.onload = () => turnstile.render('#turnstile', { sitekey: siteKey });
  document.head.appendChild(script);
}
loadTurnstile().catch(() => {});

async function requestJson(path, options) {
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || '送信できませんでした。');
  return data;
}

function post(path, body) {
  return requestJson(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}

function uploadChunk(key, range, body) {
  return requestJson('api.php?action=upload', { method: 'POST', headers: { 'X-Upload-Key': key, 'X-Content-Range': range, 'Content-Type': 'application/octet-stream' }, body: body || '' });
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!form.reportValidity()) return;
  status.className = 'status';
  submit.disabled = true;
  const inputs = [...form.elements].filter(element => ['INPUT', 'SELECT', 'TEXTAREA'].includes(element.tagName) && element.type !== 'hidden');
  const values = new FormData(form);
  inputs.forEach(element => { element.disabled = true; });
  try {
    const files = values.getAll('drawing');
    if (files.some(file => !/\.(pdf|jww)$/i.test(file.name) || !file.size) ||
        files.filter(file => /\.pdf$/i.test(file.name)).length > 10 ||
        files.filter(file => /\.jww$/i.test(file.name)).length > 10) {
      throw new Error('PDFとJWWは、それぞれ10ファイルまで添付できます。');
    }
    if (files.some(file => file.size > 50 * 1024 * 1024)) {
      throw new Error('ファイルは1つあたり50MBまでです。');
    }
    if (!pending) {
      const token = values.get('cf-turnstile-response');
      if (!token) throw new Error('「私はロボットではありません」を確認してから送信してください。');
      status.textContent = '送信の準備をしています…';
      const fields = Object.fromEntries(['company', 'branch', 'contact', 'email', 'projectName', 'projectAddress', 'heating', 'start', 'note'].map(name => [name, values.get(name)]));
      pending = await post('api.php?action=prepare', { ...fields, token, files: files.map(file => ({ name: file.name, size: file.size })) });
      pending.offsets = files.map(() => 0);
    }
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const key = pending.uploads[i];
      status.textContent = `ファイルを送信しています（${i + 1}/${files.length}）`;
      while (pending.offsets[i] < file.size) {
        const start = pending.offsets[i];
        const end = Math.min(start + pending.chunkSize, file.size);
        let result;
        try {
          result = await uploadChunk(key, `bytes ${start}-${end - 1}/${file.size}`, file.slice(start, end));
        } catch (error) {
          result = await uploadChunk(key, 'bytes */' + file.size).catch(() => { throw error; });
          if (result.offset === start) throw error;
        }
        if (result.offset <= start || result.offset > file.size) throw new Error('ファイルの送信が止まりました。もう一度お試しください。');
        pending.offsets[i] = result.offset;
      }
    }
    status.textContent = '受付内容を記録しています…';
    await post('api.php?action=finish', { receipt: pending.receipt });
    location.replace('complete.html');
  } catch (error) {
    status.className = 'status error';
    status.textContent = error.message || '送信できませんでした。もう一度お試しください。';
    if (!pending && window.turnstile) turnstile.reset();
  } finally {
    submit.disabled = false;
    inputs.forEach(element => { element.disabled = false; });
  }
});
</script>
</body>
</html>
